<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script defer src="js/vue.min.js"></script>
  <script defer src="js/main.js"></script>
  <link rel="stylesheet" href="css/main.css">
  <title>Kanban Board</title>
</head>
<body>
  <div id="app">
    <h1>Kanban Board</h1>
    <div class="board">
      <board-column 
        v-for="(config, index) in columnsConfig"
        :key="config.title"
        :title="config.title"
        :tasks="columns[index]"
        :column-index="index">
      </board-column>
    </div>
    <button 
      @click="clearCompletedTasks" 
      class="btn-clear-completed"
      :disabled="columns[3].length === 0">
      Очистить выполненные задачи
    </button>
  </div>
</body>
</html>
